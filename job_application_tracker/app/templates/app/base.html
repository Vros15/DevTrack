{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTrack</title>
    <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
</head>
<body>

    <nav>
        {% if messages %}
            <div class="toast-messages">
                {% for message in messages %}
                    <div class="toast-message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <a href="{% url 'home' %}">DevTrack</a>  

        {% if user.is_authenticated %}
            <span>Welcome, {{ user.username }}!</span>

            <button><a href="{% url 'application_list' %}" class="nav-btn">My Applications</a></button>

            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <button><a href="{% url 'login' %}" class="nav-btn">Login</a></button>
            <button><a href="{% url 'signup' %}" class="nav-btn">Sign Up</a></button>
        {% endif %}
    </nav>

    <main>
        {% block content %}

        {% endblock %}
    </main>

    <script>
        setTimeout(() => {
            const toasts = document.querySelectorAll('.toast-message');
            toasts.forEach(toast => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            });
        }, 500);
    </script>

</body>
</html>
